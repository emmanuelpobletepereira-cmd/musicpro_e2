<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#147f92"/></marker></defs><rect width="1400" height="920" fill="#f5f8fc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#19324d"><text x="60" y="62" font-size="35" font-weight="bold">Music Pro · arquitectura con Django Admin</text><text x="60" y="105" font-size="22" font-weight="normal">Evaluación 2: base de datos, modelos, migraciones y administración</text><rect x="420" y="145" width="560" height="120" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><text x="442" y="185" font-size="25" font-weight="bold">Usuario / navegador</text><text x="442" y="227" font-size="20" font-weight="normal">Único acceso de la aplicación: /admin/</text><rect x="420" y="310" width="560" height="180" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><text x="442" y="350" font-size="25" font-weight="bold">Django Admin · Core/admin.py</text><text x="442" y="392" font-size="20" font-weight="normal">Acceso staff y permisos por modelo</text><text x="442" y="424" font-size="20" font-weight="normal">CRUD de diez modelos, filtros y búsquedas</text><text x="442" y="456" font-size="20" font-weight="normal">Formularios y plantillas incorporados de Django</text><rect x="60" y="530" width="340" height="150" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><text x="82" y="570" font-size="25" font-weight="bold">Comandos de gestión</text><text x="82" y="612" font-size="20" font-weight="normal">cargar_datos: Faker por lotes</text><text x="82" y="644" font-size="20" font-weight="normal">verificar_bd: diagnóstico</text><rect x="450" y="530" width="500" height="150" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><text x="472" y="570" font-size="25" font-weight="bold">ORM · Core/models.py</text><text x="472" y="612" font-size="20" font-weight="normal">Diez modelos y relaciones protegidas</text><text x="472" y="644" font-size="20" font-weight="normal">Tipos, claves únicas y validaciones</text><rect x="1000" y="530" width="340" height="150" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><text x="1022" y="570" font-size="25" font-weight="bold">Configuración</text><text x="1022" y="612" font-size="20" font-weight="normal">settings.py: DATABASES</text><text x="1022" y="644" font-size="20" font-weight="normal">Migraciones: historial Django</text><rect x="420" y="740" width="560" height="110" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><text x="442" y="780" font-size="25" font-weight="bold">SQLite · db.sqlite3</text><text x="442" y="822" font-size="20" font-weight="normal">10 tablas propias + 10 internas de Django</text><path d="M700 265 V310" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#flecha)"/><path d="M700 490 V530" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#flecha)"/><path d="M400 605 H450" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#flecha)"/><path d="M700 680 V740" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#flecha)"/><path d="M1170 680 V795 H980" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#flecha)"/><text x="60" y="895" font-size="19" font-weight="normal">El stock se administra manualmente. La carga completa de Faker calcula el stock de sus productos nuevos.</text></g></svg>