<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-label="Music Pro · arquitectura de la aplicación"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#147f92"/></marker></defs><rect width="1600" height="1160" fill="#f5f8fc"/><g font-family="Segoe UI, Arial, sans-serif"><text x="64" y="62" font-size="36" fill="#19324d" font-weight="700" text-anchor="start">Music Pro · arquitectura de la aplicación</text><text x="64" y="105" font-size="22" fill="#526b84" font-weight="normal" text-anchor="start">Mismos elementos pedagógicos del ejemplo, aplicados al inventario de bodega</text><path d="M800 230 V270 H400 V320" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)"/><path d="M800 270 H1200 V320" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)"/><path d="M400 495 V535 H800 V580" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)"/><path d="M1200 495 V535 H800 V580" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)"/><path d="M800 755 V805" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)"/><path d="M410 665 H475" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)"/><path d="M1370 580 V535 H1450 V495" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="560" y="145" width="480" height="85" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M574,145 H1026 Q1040,145 1040,159 V197 H560 V159 Q560,145 574,145" fill="#205879"/><text x="582" y="180" font-size="25" fill="white" font-weight="600" text-anchor="start">Usuario / navegador</text><rect x="120" y="320" width="560" height="175" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M134,320 H666 Q680,320 680,334 V372 H120 V334 Q120,320 134,320" fill="#205879"/><text x="142" y="355" font-size="25" fill="white" font-weight="600" text-anchor="start">Django Admin · evaluación 2</text><text x="142" y="405" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Acceso staff y permisos por modelo</text><text x="142" y="435" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">CRUD de los diez modelos de bodega</text><text x="142" y="465" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Filtros, búsquedas, formularios y validación</text><rect x="920" y="320" width="560" height="175" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M934,320 H1466 Q1480,320 1480,334 V372 H920 V334 Q920,320 934,320" fill="#205879"/><text x="942" y="355" font-size="25" fill="white" font-weight="600" text-anchor="start">Vistas y ModelForm · complemento</text><text x="942" y="405" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Inventario y movimientos: consulta paginada</text><text x="942" y="435" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">CRUD de productos: login + permisos</text><text x="942" y="465" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Plantillas, CSRF y confirmación al eliminar</text><rect x="475" y="580" width="650" height="175" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M489,580 H1111 Q1125,580 1125,594 V632 H475 V594 Q475,580 489,580" fill="#205879"/><text x="497" y="615" font-size="25" fill="white" font-weight="600" text-anchor="start">ORM y modelos · Core/models.py</text><text x="497" y="665" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Catálogos · productos · documentos · movimientos</text><text x="497" y="695" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Tipos, claves únicas, CHECK y PROTECT</text><text x="497" y="725" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Consultas y escrituras a la misma base</text><rect x="65" y="580" width="345" height="175" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M79,580 H396 Q410,580 410,594 V632 H65 V594 Q65,580 79,580" fill="#205879"/><text x="87" y="615" font-size="25" fill="white" font-weight="600" text-anchor="start">Configuración y rutas</text><text x="87" y="665" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">musicpro_backend/settings.py</text><text x="87" y="695" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">URLs → Core/views.py</text><text x="87" y="725" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">DATABASES y migraciones</text><rect x="1190" y="580" width="345" height="175" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M1204,580 H1521 Q1535,580 1535,594 V632 H1190 V594 Q1190,580 1204,580" fill="#205879"/><text x="1212" y="615" font-size="25" fill="white" font-weight="600" text-anchor="start">Presentación local</text><text x="1212" y="665" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">templates/ y Core/static/</text><text x="1212" y="695" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">HTML + CSS propio</text><text x="1212" y="725" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Sin paquetes adicionales</text><rect x="475" y="805" width="650" height="110" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M489,805 H1111 Q1125,805 1125,819 V857 H475 V819 Q475,805 489,805" fill="#205879"/><text x="497" y="840" font-size="25" fill="white" font-weight="600" text-anchor="start">SQLite · db.sqlite3</text><text x="497" y="890" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">10 tablas de negocio + 10 internas de Django</text><text x="400" y="300" font-size="20" fill="#19324d" font-weight="normal" text-anchor="middle">/admin/</text><text x="1200" y="300" font-size="20" fill="#19324d" font-weight="normal" text-anchor="middle">/ · /movimientos/ · /productos/…</text><text x="830" y="788" font-size="19" fill="#19324d" font-weight="normal" text-anchor="start">ORM + conexión default</text><rect x="64" y="1018" width="1472" height="106" rx="14" fill="#e7f0f7"/><text x="86" y="1055" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">El Admin y las vistas usan los mismos modelos y registros; las escrituras requieren permisos de Django.</text><text x="86" y="1085" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">E2 se demuestra en Admin. El CRUD web conserva el elemento de formularios del proyecto de referencia.</text><text x="86" y="1115" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">El stock se administra manualmente; un movimiento no actualiza automáticamente la cantidad del producto.</text></g></svg>