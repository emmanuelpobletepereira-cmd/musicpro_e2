<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-label="Music Pro · carga y verificación con Faker"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#147f92"/></marker></defs><rect width="1600" height="1140" fill="#f5f8fc"/><g font-family="Segoe UI, Arial, sans-serif"><text x="64" y="62" font-size="36" fill="#19324d" font-weight="700" text-anchor="start">Music Pro · carga y verificación con Faker</text><text x="64" y="105" font-size="22" fill="#526b84" font-weight="normal" text-anchor="start">Comando: python manage.py cargar_datos · memoria proporcional al tamaño del lote</text><path d="M800 250 V290" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)"/><path d="M800 400 V440" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)"/><path d="M800 550 V590" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)"/><path d="M800 760 V800" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)"/><path d="M1115 675 H1390 V495 H1115" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="150" width="630" height="100" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M499,150 H1101 Q1115,150 1115,164 V202 H485 V164 Q485,150 499,150" fill="#205879"/><text x="507" y="185" font-size="25" fill="white" font-weight="600" text-anchor="start">1 · Recibir y validar parámetros</text><text x="507" y="235" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">--cantidad 1..1.000.000 · --lote 1..10.000</text><rect x="485" y="290" width="630" height="110" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M499,290 H1101 Q1115,290 1115,304 V342 H485 V304 Q485,290 499,290" fill="#205879"/><text x="507" y="325" font-size="25" fill="white" font-weight="600" text-anchor="start">2 · Preparar Faker y catálogos</text><text x="507" y="375" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">es_CL + semilla · catálogos según la modalidad</text><rect x="485" y="440" width="630" height="110" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M499,440 H1101 Q1115,440 1115,454 V492 H485 V454 Q485,440 499,440" fill="#205879"/><text x="507" y="475" font-size="25" fill="white" font-weight="600" text-anchor="start">3 · Construir un lote de productos</text><text x="507" y="525" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Código UUID + secuencia · valores dentro de límites</text><rect x="485" y="590" width="630" height="170" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M499,590 H1101 Q1115,590 1115,604 V642 H485 V604 Q485,590 499,590" fill="#205879"/><text x="507" y="625" font-size="25" fill="white" font-weight="600" text-anchor="start">4 · Guardar el lote en una transacción</text><text x="507" y="675" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">bulk_create(productos) → SQLite</text><text x="507" y="705" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Modalidades: básica / ingresos / compra-venta</text><text x="507" y="735" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Confirmar productos, documentos y movimientos</text><rect x="485" y="800" width="630" height="140" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M499,800 H1101 Q1115,800 1115,814 V852 H485 V814 Q485,800 499,800" fill="#205879"/><text x="507" y="835" font-size="25" fill="white" font-weight="600" text-anchor="start">5 · Verificar lo almacenado</text><text x="507" y="885" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Verificar productos y relaciones según modalidad</text><text x="507" y="915" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Mostrar antes, después, productos nuevos y tiempo</text><text x="1410" y="590" font-size="22" fill="#19324d" font-weight="normal" text-anchor="start">¿Quedan</text><text x="1410" y="620" font-size="22" fill="#19324d" font-weight="normal" text-anchor="start">productos?</text><text x="1410" y="650" font-size="22" fill="#147f92" font-weight="600" text-anchor="start">Sí: otro lote</text><text x="825" y="789" font-size="19" fill="#19324d" font-weight="normal" text-anchor="start">No: comprobar la carga</text><rect x="65" y="590" width="345" height="170" rx="14" fill="white" stroke="#c9d8e5" stroke-width="2"/><path d="M79,590 H396 Q410,590 410,604 V642 H65 V604 Q65,590 79,590" fill="#855324"/><text x="87" y="625" font-size="25" fill="white" font-weight="600" text-anchor="start">Si falla o se interrumpe</text><text x="87" y="675" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Revertir el lote actual</text><text x="87" y="705" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Conservar lotes confirmados</text><text x="87" y="735" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Informar cuántos se guardaron</text><path d="M485 675 H410" fill="none" stroke="#147f92" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="64" y="998" width="1472" height="106" rx="14" fill="#e7f0f7"/><text x="86" y="1035" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">--cantidad cuenta productos nuevos; --con-movimientos añade N ingresos; --completo añade documentos y 2N movimientos.</text><text x="86" y="1065" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">DEBUG se desactiva solo durante la carga para evitar acumular el SQL; las restricciones siguen vigentes.</text><text x="86" y="1095" font-size="21" fill="#19324d" font-weight="normal" text-anchor="start">Los ensayos de 100, 1.000, 100.000 y 1.000.000 se realizan en otra base mediante MUSICPRO_DB_PATH.</text></g></svg>